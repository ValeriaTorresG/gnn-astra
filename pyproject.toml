[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quijote-gnn"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "torch>=2.0", "torch-geometric>=2.3", "networkx>=2.8"]

[project.optional-dependencies]
fits = ["astropy>=5"]

[tool.setuptools.packages.find]
where = ["src"]
